<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrada Manual</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/entradaManual.css">
</head>
<body>
    <header>
        <div class="style-padrao borda">
            /*usuario*/
        </div>
    </header>
    <main class="container-fluid">
        
        <button class="navbar-toggler shadow-none navbar"
        type="button"
        id="btn-toggler-sec-menu"
        data-bs-toggle="collapse"
        data-bs-target="#meuMenu"
        aria-controls="meuMenu"
        aria-expanded="false"
        aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse" id="meuMenu">
            <ul>
                <li id="liBtnSalvar"></li>
                <li id="liLinha1"></li>
                <li id="liBtnVoltar"></li>
                <li id="liLinha2"></li>
                <li id="liPagInicial"></li>
            </ul>
        </div>

        <section id="sec-menu">
            <button type="button" class="borda btn-salvar" id="btnSalvar">
                <img src="../img/salvar.svg" alt="" class="icon-l" id="imgSalvar">

                <div>
                    <hr>
                    Salvar
                </div>
            </button>

            <hr class="linha-vertical" id="linha1">

            <a href="./produtos.html" class="borda" id="btnVoltar">
                <img src="../img/voltar.svg" alt="" class="icon-l" id="imgVoltar">

                <div>
                    <hr>
                    Voltar
                </div>
            </a>

            <hr class="linha-vertical" id="linha2">

            <a href="./index.html" class="borda" id="pagInicial">
                <img src="../img/pag-inicial.svg" alt="" class="icon-l" id="imgPagInicial">

                <div>
                    <hr>
                    <div id="textPagInicial">
                        Pg. Inicial
                    </div>
                </div>
            </a>
        </section>

        <section class="container sec-cadastro borda style-padrao">

            <legend>
                Entrada Manual

                <button class="navbar-toggler shadow-none"
                type="button"
                id="btn-toggler-sec-cadastro"
                data-bs-toggle="collapse"
                data-bs-target="#formCadastro"
                aria-controls="formCadastro"
                aria-expanded="false"
                aria-label="Abrir formulario">
                    <img src="../img/btn-toggle.svg" alt="" class="icon-s">
                </button>
            </legend>

            <form action="#" method="#" id="formCadastro" class="collapse">
                <section class="sec-dados-prod">
                    <div>
                        <label for="">Operação:</label>
                        <select name="operacao" id="operacao">
                            <option value="ENTRADA">Entrada</option>
                            <option value="SAIDA">Saída</option>
                        </select>
                    </div>

                    <div>
                        <label for="codigo" class="ajusteLabel">Código:</label>
                        <input type="text" name="codigo" id="codigo" class="validation-number" autocomplete="off" required>
                    </div>
                </section>

                <br>

                <section>
                    <div>
                        <label for="produto">Produto:</label>
                        <input type="text" name="produto" id="produto" class="disabled" readonly>
                    </div>
                </section>

                <hr>

                <section class="sec-dados-prod">
                    <div>
                        <label for="custoAtual">Custo Atual:</label>
                        <input type="text" name="custoAtual" id="custoAtual" class="disabled" readonly>
                    </div>

                    <div>
                        <label for="precoAtual" class="ajusteLabel">Preço Atual:</label>
                        <input type="text" name="precoAtual" id="precoAtual" class="disabled" readonly>
                    </div>

                    <div>
                        <label for="estAtual" class="ajusteLabel">Est. Atual:</label>
                        <input type="text" name="estAtual" id="estAtual" class="disabled" readonly>
                    </div>
                </section>

                <br>

                <section class="sec-dados-prod mb-3">
                    <div>
                        <label for="novoCusto">Novo Custo:</label>
                        <input type="text" name="novoCusto" id="novoCusto" class="validation-number" autocomplete="off">
                    </div>

                    <div>
                        <label for="novoPreco" class="ajusteLabel">Novo Preço:</label>
                        <input type="text" name="novoPreco" id="novoPreco" class="validation-number" autocomplete="off">
                    </div>

                    <div>
                        <label for="novoEst" class="ajusteLabel">Quantidade:</label>
                        <input type="text" name="novoEst" id="novoEst" class="validation-number" autocomplete="off" required>
                    </div>
                </section>
            </form>
        </section>
        
        <section class="table-responsive sec-table ">
            <table class="table table-striped table-bordered">

                <thead>
                    <tr>
                        <th id="width-selecionar">Selecionar</th>
                        <th id="width-data">Data</th>
                        <th id="width-usuario">Usuário</th>
                        <th id="width-operacao">Operação</th>
                        <th id="width-codigo">Código</th>
                        <th id="width-prod">Produto</th>
                        <th id="width-qtd-mov">Quant. Mov.</th>
                        <th id="width-custo">Custo</th>
                        <th id="width-preco">Preço</th>
                    </tr>
                </thead>

                <tbody>
                    <!--linha de molde-->
                    <tr>
                        <td>
                            <input type="radio" name="selecionar" id="<%/*backend*/%>" class="form-check-input">
                        </td>
                        <td>14/11/2026</td>
                        <td>Marco</td>
                        <td>ENTRADA</td>
                        <td>001</td>
                        <td>PASTA ESCOLAR TIPO A</td>
                        <td>3</td>
                        <td>2,75</td>
                        <td>6,90</td>
                    </tr>
                    <!--linha de molde-->
                </tbody>
            </table>
        </section>
    </main>
    
    <footer>
        <img src="../img/logo.svg" alt="" class="icon-m me-2"> 
        <span class="fs-4 text-logo">Say-System</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

   <script src="../js/entradaManual.js"></script>
</body>
</html>
