<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrada Manual</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/entradaManual.css">
</head>
<body>
    <header>
        <div class="style-padrao borda">
            /*usuario*/
        </div>
    </header>
    <main class="container-fluid">
        <section id="sec-menu">
            <a href="./produtos.html" class="borda">
                <img src="../img/voltar.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Voltar
                </div>
            </a>

            <hr class="linha-vertical">

            <a href="./index.html" class="borda">
                <img src="../img/pag-inicial.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Pg. Inicial
                </div>
            </a>
        </section>

        <section class="container sec-cadastro borda style-padrao">

            <legend>Entrada Manual</legend>

            <form action="#" method="#">
                <section class="sec-dados-prod">
                    <div>
                        <label for="">Operação:</label>
                        <select name="operacao" id="operacao">
                            <option value="ENTRADA">Entrada</option>
                            <option value="SAIDA">Saída</option>
                        </select>
                    </div>
                
                    <div>
                        <label for="codigo" class="ajusteLabel">Código:</label>
                        <input type="text" name="codigo" id="codigo" autocomplete="off" required>
                    </div>
                </section>

                <br>

                <section>
                    <div>
                        <label for="produto">Produto:</label>
                        <input type="text" name="produto" id="produto" class="disabled" readonly>
                    </div>
                </section>

                <hr>

                <section class="sec-dados-prod">
                    <div>
                        <label for="custoAtual">Custo Atual:</label>
                        <input type="text" name="custoAtual" id="custoAtual" class="disabled" readonly>
                    </div>

                    <div>
                        <label for="precoAtual" class="ajusteLabel">Preço Atual:</label>
                        <input type="text" name="precoAtual" id="precoAtual" class="disabled" readonly>
                    </div>

                    <div>
                        <label for="estAtual" class="ajusteLabel">Est. Atual:</label>
                        <input type="text" name="estAtual" id="estAtual" class="disabled" readonly>
                    </div>
                </section>

                <br>

                <section class="sec-dados-prod">
                    <div>
                        <label for="novoCusto">Novo Custo:</label>
                        <input type="text" name="novoCusto" id="novoCusto" autocomplete="off">
                    </div>

                    <div>
                        <label for="novoPreco" class="ajusteLabel">Novo Preço:</label>
                        <input type="text" name="novoPreco" id="novoPreco" autocomplete="off">
                    </div>

                    <div>
                        <label for="novoEst" class="ajusteLabel">Novo Est.:</label>
                        <input type="text" name="novoEst" id="novoEst" autocomplete="off">
                    </div>
                </section>

                <br>

                <button type="submit" class="btn" id="btnConfirmar">
                    Confirmar
                </button>
            </form>
        </section>
        
        <section class="table-responsive sec-table ">
            <table class="table table-striped table-bordered">

                <thead>
                    <tr>
                        <th id="width-descricao">Descrição</th>
                        <th id="width-codigo">Código</th>
                        <th id="width-estoque">Estoque</th>
                        <th id="width-vend-hoje">Vend. Hoje</th>
                        <th id="width-dias-vendes">Dias s/ Vender</th>
                        <th id="width-custo">Custo</th>
                        <th id="width-valor">Valor</th>
                    </tr>
                </thead>

                <tbody>
                    <!--linha de molde-->
                    <tr>
                        <td>BLUSA DE LINHO AZUL TAMANHO M</td>
                        <td>1</td>
                        <td>15</td>
                        <td>1</td>
                        <td>60</td>
                        <td>9,50</td>
                        <td>29,90</td>
                    </tr>
                    <!--linha de molde-->
                </tbody>
            </table>
        </section>
    </main>
    
    <footer>
        <img src="../img/logo.svg" alt="" class="icon-m me-2"> 
        <span class="fs-4 text-logo">Say-System</span>
    </footer>
</body>
</html>
