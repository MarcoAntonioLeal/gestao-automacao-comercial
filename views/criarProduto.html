<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Novo Produto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/criarProduto.css">
</head>
<body>
    <header>
        <div class="style-padrao borda">
            /*usuario*/
        </div>
    </header>

     <main class="container">
        
        <section id="sec-menu">
            <button type="button" class="borda btn-menu btn-novo" data-btn-menu="novo">
                <img src="../img/novo-produto.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Novo
                </div>
            </button>

            <hr class="linha-vertical">

            <button type="button" class="borda btn-menu btn-salvar" data-btn-menu="salvar">
                <img src="../img/salvar.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Salvar
                </div>
            </button>

            <hr class="linha-vertical">

            <!--botão modal p/ confimar a exclusão-->
            <button type="button" class="borda btn-menu btn-excluir" data-btn-menu="excluir" data-bs-toggle="modal" data-bs-target="#staticExcluir">
                <img src="../img/excluir.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Excluir
                </div>
            </button>

            <!--modal p/ confimar a exclusão-->
            <div class="modal fade" id="staticExcluir" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalExcluir" aria-hidden="true">
                <div class="modal-dialog modal-sm">
                    <div class="modal-content">

                        <div class="modal-body text-start" id="modalExcluir">
                            Deseja mesmo excluir esse produto ?
                        </div>

                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary btn-sm" data-bs-dismiss="modal" data-confirma="true">
                                Confirmar
                            </button>

                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
                                Voltar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <hr class="linha-vertical">

            <a href="./produtos.html" class="borda btn-voltar">
                <img src="../img/voltar.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Voltar
                </div>
            </a>

            <hr class="linha-vertical">

            <a href="./index.html" class="borda btn-pag-incial">
                <img src="../img/pag-inicial.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Pg. Inicial
                </div>
            </a>
        </section>

        <section class="container sec-cadastro borda style-padrao">
            <form action="#" class="formCriarProduto">
                <fieldset>
                    <legend>Produto</legend>
                    
                    <div class="codigo-e-status">
                        <div>
                            <label for="codigo">Código:</label>
                            <input type="text" name="codigo" class="disabled" id="codigo" readonly>
                        </div>

                        <div class="form-check form-switch status">
                            <input class="form-check-input" type="checkbox" role="switch" id="ativo-inativo" checked>
                            <label class="form-check-label" for="ativo-inativo">Ativo</label>
                        </div>
                    </div>

                    <br>

                    <div>
                        <label for="descricao">Descrição:</label>
                        <input type="text" name="descricao" id="descricao" autocomplete="off" maxlength="100" required>
                            
                        <label for="cod-barras" class="ms-4">Código de Barras:</label>
                        <input type="text" name="cod-barras" id="cod-barras" autocomplete="off" maxlength="14" minlength="8" pattern="/^\d{8,14}$/" title="Digite apenas números">
                    </div>

                    <hr>

                    <div class="preco-e-custo py-3">
                        <label for="estoque">Estoque:</label>
                        <input type="text" name="estoque" id="estoque" autocomplete="off" maxlength="7" required pattern="\d+([.,]\d{1,2})?" title="Números inteiros ou com no máximo duas casas decimais" value="0"> <!--  Aqui no value colocar no ejs <%- valor | 0 %>  -->

                        <label for="custo" class="ms-4">Custo:</label>
                        <input type="text" name="custo" id="custo" autocomplete="off" data-preco = "custo" maxlength="6" class="calcValorProduto" pattern="\d+([.,]\d{1,2})?" title="Números inteiros ou com no máximo duas casas decimais" value="0"> <!--Aqui no value colocar no ejs <%- valor | 0 %>-->

                        <label for="margem" class="ms-4">Margem em % :</label>
                        <input type="text" name="margem" id="margem" autocomplete="off" data-preco = "margem" maxlength="6" class="calcValorProduto" pattern="\d+([.,]\d{1,2})?" title="Números inteiros ou com no máximo duas casas decimais | Margem do produto não pode ser negativa">

                        <label for="preco" class="ms-4">Preço:</label>
                        <input type="text" name="preco" id="preco" autocomplete="off" data-preco="preco" maxlength="7" class="calcValorProduto" required pattern="\d+([.,]\d{1,2})?" title="Números inteiros ou com no máximo duas casas decimais">
                    </div>
                
                    <hr>

                    <div class="grupo-unidade-venda">

                        <!--------------------------------------- GRUPOS ----------------------------------------------->

                        <label for="grupo">Grupos:</label>
                        <input list="grupos" name="grupo" id="grupo" autocomplete="off">
                        <datalist id="grupos">
                        <!--linha de molde-->
                            <option value="blusas"></option>
                            <option value="bolsas"></option>
                        <!--linha de molde-->
                        </datalist>

                        <!--botão modal para criacao de grupo-->
                        <button type="button" class="btn btn-criar-grupo-unidade-venda action-grupo" data-bs-toggle="modal" data-bs-target="#staticGrupo" data-bs-placement="top">

                            <img src="../img/+.svg" alt="" class="icon-xs">

                        </button> 

                        <!-- Modal para criar novo grupo--> 
                        <div class="modal fade" id="staticGrupo" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="grupoLabel" aria-hidden="true">
                                
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-4" id="grupoLabel">
                                            Grupos
                                        </h1>

                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>

                                    <div class="modal-body">

                                        <!--Modal menu do grupo-->
                                        <section class="sec-modal-menu">

                                            <button type="button" class="borda btn-novo-grupo btn-menu-grupo" data-btn-menu-grupo="novo">
                                                <img src="../img/grupo.svg" alt="" class="icon-s">

                                                <div>
                                                    <hr>
                                                    Novo
                                                </div>
                                            </button>

                                            <hr class="linha-modal-vertical">

                                            <button type="button" class="borda btn-cancelar-grupo btn-menu-grupo" data-btn-menu-grupo="cancelar">
                                                <img src="../img/cancelar.svg" alt="" class="icon-s">

                                                <div>
                                                    <hr>
                                                    Cancelar
                                                </div>
                                            </button>

                                            <hr class="linha-modal-vertical">

                                            <button type="button" class="borda btn-salvar-grupo btn-menu-grupo" data-btn-menu-grupo="salvar">
                                                <img src="../img/salvar.svg" alt="" class="icon-s">

                                                <div>
                                                    <hr>
                                                    Salvar
                                                </div>
                                            </button>

                                            <hr class="linha-modal-vertical">

                                            <button type="button" class="borda btn-excluir-grupo btn-menu-grupo" data-btn-menu-grupo="excluir">
                                                <img src="../img/excluir.svg" alt="" class="icon-s">

                                                <div>
                                                    <hr>
                                                    Excluir
                                                </div>
                                            </button>
                                        </section>   
                                    </div>

                                    <div class="modal-footer footer-modal-grupo">
                                        <section>
                                            <input type="text" name="nomeGrupo" id="nomeGrupo" autocomplete="off" maxlength="18" placeholder="grupo...">
                                        </section>

                                        <section class="sec-modal-table">
                                            <table class="table table-striped">
                                                <!--linha de molde-->
                                                <tr>
                                                    <td>
                                                        <input type="radio" name="grupo-value" class="grupo">
                                                    </td>
                                                    <td class="id-td">01</td>
                                                    <td class="nome-td">grupo 1</td>
                                                </tr>
                                                <!--linha de molde-->
                                            </table>
                                        </section>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!--------------------------------------- UNIDADES DE VENDA ----------------------------------------------->
                
                        <div>
                            <label for="unidadeVenda" class="ms-4">Unidade Venda:</label>
                            <select name="unidadeVenda" id="unidadeVenda">
                                <option value="un" selected>un</option>
                                <option value="pc">kg</option>
                                <option value="kg">l</option>
                                <option value="ml">ml</option>
                                <option value="m">m</option>
                            </select>  
                        </div>

                        <!--botão modal para criacao de unidade de venda-->
                        <button type="button" class="btn btn-criar-grupo-unidade-venda action-unidade-venda" data-bs-toggle="modal" data-bs-target="#staticUnidadeVenda" data-bs-placement="top">

                            <img src="../img/+.svg" alt="" class="icon-xs">

                        </button> 

                        <!--Modal para criar nova unidade de venda--> 
                        <div class="modal fade" id="staticUnidadeVenda" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="unidadeVendaLabel" aria-hidden="true">
                                
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h1 class="modal-title fs-4" id="unidadeVendaLabel">
                                            Unidades de Venda
                                        </h1>

                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>

                                    <div class="modal-body">

                                        <!--Modal menu unidade de venda-->
                                        <section class="sec-modal-menu">

                                            <button type="button" class="borda btn-nova-unidadeVenda btn-menu-unidadeVenda" data-btn-unidade-venda="novo">
                                                <img src="../img/grupo.svg" alt="" class="icon-s">

                                                <div>
                                                    <hr>
                                                    Novo
                                                </div>
                                            </button>

                                            <hr class="linha-modal-vertical">

                                                <button type="button" class="borda btn-cancelar-unidadeVenda btn-menu-unidadeVenda" data-btn-unidade-venda="cancelar">
                                                <img src="../img/cancelar.svg" alt="" class="icon-s">

                                                <div>
                                                    <hr>
                                                    Cancelar
                                                </div>
                                            </button>

                                            <hr class="linha-modal-vertical">

                                            <button type="button" class="borda btn-salvar-unidadeVenda btn-menu-unidadeVenda" data-btn-unidade-venda="salvar">
                                                <img src="../img/salvar.svg" alt="" class="icon-s">

                                                <div>
                                                    <hr>
                                                    Salvar
                                                </div>
                                            </button>

                                            <hr class="linha-modal-vertical">

                                            <button type="button" class="borda btn-excluir-unidadeVenda btn-menu-unidadeVenda" data-btn-unidade-venda="excluir">
                                                <img src="../img/excluir.svg" alt="" class="icon-s">

                                                <div>
                                                    <hr>
                                                    Excluir
                                                </div>
                                            </button>
                                        </section>   
                                    </div>

                                    <div class="modal-footer footer-modal-grupo">
                                        <section>
                                            <input type="text" name="nomeUnidadeVenda" id="nomeUnidadeVenda" autocomplete="off" maxlength="18" placeholder="Unidade de Venda...">
                                        </section>

                                        <section class="sec-modal-table">
                                            <table class="table table-striped">
                                                <!--linha de molde-->
                                                <tr>
                                                    <td>
                                                        <input type="radio" name="grupo-value" class="unidadeVenda">
                                                    </td>
                                                    <td class="id-td">01</td>
                                                    <td class="nome-td">UN</td>
                                                </tr>
                                                <!--linha de molde-->
                                            </table>
                                        </section>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="fornecedores">
                            <label for="fornecedor" class="ms-4">Fornecedores:</label>
                            <select name="fornecedor" id="fornecedor">
                            <!--linha de molde-->
                                <option value="NULL"></option>
                                <option value="fornecedor 01">fornecedor 01</option>
                                <option value="fornecedor 02">fornecedor 02</option>
                            <!--linha de molde-->
                            </select>
                        </div>
                    </div>

                    <br>
                
                    <div>
                        <label for="obsProduto" class="mt-2">Observações do produto:</label>
                        <br>
                        <textarea name="obsProduto" id="obsProduto" maxlength="100" rows="3" cols="50"></textarea>
                    </div>
                </fieldset>
            </form>
        </section>
     </main>

     <footer>
        <img src="../img/logo.svg" alt="Logo" class="icon-m me-2"> 
        <span class="fs-4 text-logo">Say-System</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="../js/criarProduto.js"></script>
</body>
