<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configuração Operacional</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/configOperacionais.css">
</head>
<body>
    <header class="container">
        <div class="style-padrao borda">
            /*usuario*/
        </div>
    </header>

    <main class="container">
        
        <section id="sec-menu">
            <button type="button" class="borda" id="btnSalvar">
                <img src="../img/salvar.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Salvar
                </div>
            </button>

            <hr class="linha-vertical">

            <a href="./index.html" class="borda">
                <img src="../img/pag-inicial.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Pg. Inicial
                </div>
            </a>
        </section>

        <section class="container sec-cadastro borda style-padrao">
            <form action="#" method="#">
                <legend>Parâmetros do Sistema</legend>

                    <section>
                        <h5>Configurações de Vendas:</h5>
                        <h6>Tipo de Venda</h6>
                        
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipoVenda" id="VendaOrcamento" checked>

                            <label class="form-check-label" for="VendaOrcamento">
                                Venda e Orçamento
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipoVenda" id="venda">

                            <label class="form-check-label" for="venda">
                                Somente Venda
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="tipoVenda" id="orcamento">

                            <label class="form-check-label" for="orcamento">
                                Somente Orçamento
                            </label>
                        </div>

                        <br>

                        <h6>Controle de Caixa</h6>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="switchCheckChecked" checked>

                            <label class="form-check-label" for="switchCheckChecked">Irá trabalhar com controle de caixa</label>
                        </div>
                    </section>

                    <hr>

                    <section>
                        <h5>Configurações de E-mail:</h5>
                        
                        <div>
                            <label for="email:">E-mail:</label>
                            <input type="text" name="email" id="email" autocomplete="off">
                        </div>
                
                        <div>
                            <label for="smtp">SMTP:</label>
                            <input type="text" name="smtp" id="smtp" autocomplete="off" value="smtp.gmail.com">
                        </div>

                        <div>
                            <label for="porta">Porta:</label>
                            <input type="text" name="porta" id="porta" autocomplete="off" value="587">
                        </div>

                        <div>
                            <label for="">Protocolo:</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="protocolo" id="prot1" checked>
                                <label class="form-check-label" for="prot1">
                                    TLS
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="protocolo" id="prot2">
                                <label class="form-check-label" for="prot2">
                                    SSL
                                </label>
                            </div>
                        </div>

                        <label for="senhaApp">Senha de App:</label>
                        <input type="text" name="senhaApp" id="senhaApp" autocomplete="off">
                    </section>

                    <hr>

                    <section>
                        <h5>Outras Configurações:</h5>

                        <div>
                            <label for="path_logo">Logo:</label>
                            <input type="text" name="path_logo" id="path_logo" autocomplete="off">
                        </div>

                        <div>
                            <label for="path_impressora">Impressora:</label>
                            <input type="text" name="path_impressora" id="path_impressora" autocomplete="off">
                        </div>
                    </section>
            </form>
        </section>
     </main>

     <footer>
        <img src="../img/logo.svg" alt="" class="icon-m me-2"> 
        <span class="fs-4 text-logo">Say-System</span>
    </footer>
</body>
