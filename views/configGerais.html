<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configuração Geral</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/configGerais.css">
</head>
<body>
    <body>

    <header>
        <div class="style-padrao borda">
            /*usuario*/
        </div>
    </header>

     <main class="container">
        
        <section id="sec-menu">
            <button type="button" class="borda">
                <img src="../img/salvar.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Salvar
                </div>
            </button>

            <hr class="linha-vertical">

            <a href="./index.html" class="borda">
                <img src="../img/pag-inicial.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Pg. Inicial
                </div>
            </a>
        </section>

        <section class="container sec-cadastro borda style-padrao">
            <form action="#" method="#">
                    <legend>Cadastro Empresa</legend>

                    <div>
                        <label for="razao">Razão Social:</label>
                        <input type="text" name="razao" id="razao" autocomplete="off" maxlength="70" required>
                    </div>

                    <div>
                        <select name="" id="">
                            <option value=""></option>
                            <option value=""></option>
                        </select>
                    </div>

                    <hr>

                    <div class="preco-e-custo py-3">
                        <label for="estoque">Estoque:</label>
                        <input type="text" name="estoque" id="estoque" autocomplete="off" maxlength="7" required pattern="\d+([.,]\d{1,2})?" title="Números inteiros ou com no máximo duas casas decimais" value="0"> <!--  Aqui no value colocar no ejs <%- valor | 0 %>  -->

                        <label for="custo" class="ms-4">Custo:</label>
                        <input type="text" name="custo" id="custo" autocomplete="off" data-preco = "custo" maxlength="6" class="calcValorProduto" pattern="\d+([.,]\d{1,2})?" title="Números inteiros ou com no máximo duas casas decimais" value="0"> <!--Aqui no value colocar no ejs <%- valor | 0 %>-->

                        <label for="margem" class="ms-4">Margem em % :</label>
                        <input type="text" name="margem" id="margem" autocomplete="off" data-preco = "margem" maxlength="6" class="calcValorProduto" pattern="\d+([.,]\d{1,2})?" title="Números inteiros ou com no máximo duas casas decimais | Margem do produto não pode ser negativa">

                        <label for="preco" class="ms-4">Preço:</label>
                        <input type="text" name="preco" id="preco" autocomplete="off" data-preco="preco" maxlength="7" class="calcValorProduto" required pattern="\d+([.,]\d{1,2})?" title="Números inteiros ou com no máximo duas casas decimais">
                    </div>

                    <hr>
            </form>
        </section>
     </main>

     <footer>
        <img src="../img/logo.svg" alt="Logo" class="icon-m me-2"> 
        <span class="fs-4 text-logo">Say-System</span>
    </footer>
                          
</body>

<!--
    nome_empresa TEXT NOT NULL CHECK(length(nome_empresa) <= 70),
	tipo_pessoa TEXT NOT NULL CHECK(tipo_pessoa IN ('PF', 'PJ')),
   	cpf TEXT CHECK(length(cpf) = 11),
	cnpj TEXT CHECK(length(cnpj) = 14),	
	cep TEXT CHECK(length(cep) = 8),
	rua TEXT,
	bairro TEXT,
	cidade TEXT,
	uf TEXT CHECK(length(uf) = 2),
	telefone_fixo TEXT CHECK(length(telefone_fixo) = 10),
	celular_01 TEXT CHECK(length(celular_01) = 11),
	celular_02 TEXT CHECK(length(celular_02) = 11),
	email_01 TEXT,
	email_02 TEXT,
-->
