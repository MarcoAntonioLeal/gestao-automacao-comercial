<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configuração Geral</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/configGerais.css">
</head>
<body>
    <body>

    <header>
        <div class="style-padrao borda">
            /*usuario*/
        </div>
    </header>

     <main class="container">
        
        <section id="sec-menu">
            <button type="button" class="borda">
                <img src="../img/salvar.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Salvar
                </div>
            </button>

            <hr class="linha-vertical">

            <a href="./index.html" class="borda">
                <img src="../img/pag-inicial.svg" alt="" class="icon-l">

                <div>
                    <hr>
                    Pg. Inicial
                </div>
            </a>
        </section>

        <section class="container sec-cadastro borda style-padrao">
            <form action="#" method="#">
                    <legend>Cadastro Empresa</legend>

                    <div>
                        <label for="razao">Razão Social:</label>
                        <input type="text" name="razao" id="razao" autocomplete="off" maxlength="70" required>
                    </div>

                    <div>
                        <label for="">Tipo Pessoa:</label>
                        <select name="tipo_pessoa" id="tipo_pessoa">
                            <option value="PF">Física</option>
                            <option value="PJ">Jurídica</option>
                        </select>
                    </div>

                    <div>
                        <label for="">CPF:</label>
                        <input type="text" name="identificacao" id="identificacao" required>
                    </div>

                    <hr>

                    <div>
                        <label for="cep">CEP:</label>
                        <input type="text" name="cep" id="cep" autocomplete="off" maxlength="8" required pattern="" title="">

                        <label for="rua">Rua:</label>
                        <input type="text" name="rua" id="rua" autocomplete="off" required >

                        <label for="cidade">Cidade:</label>
                        <input type="text" name="cidade" id="cidade" autocomplete="off" required pattern="" title="">

                        <label for="bairro">Bairro:</label>
                        <input type="text" name="bairro" id="bairro" autocomplete="off" required pattern="" title="">

                        <label for="uf">UF:</label>
                        <input type="text" name="uf" id="uf" autocomplete="off" maxlength="2" required pattern="" title="">
                    </div>

                    <hr>

                    <div>
                        <label for="telFixo">Telefone Fixo:</label>
                        <input type="tel" name="telFixo" id="telFixo" autocomplete="off" maxlength="10" pattern="" title="">

                        <label for="celular01">Celualar 01:</label>
                        <input type="tel" name="celular01" id="celular01" autocomplete="off" maxlength="11" pattern="" title="">

                        <label for="celular02">Celular 02:</label>
                        <input type="tel" name="celular02" id="celular02" autocomplete="off" maxlength="11" pattern="" title="">

                        <label for="email01">E-mail 01:</label>
                        <input type="email" name="email01" id="email01" autocomplete="off" pattern="" title="">

                        <label for="email02">E-mail 02:</label>
                        <input type="email" name="email02" id="email02" autocomplete="off" pattern="" title="">
                    </div>
            </form>
        </section>
     </main>

     <footer>
        <img src="../img/logo.svg" alt="Logo" class="icon-m me-2"> 
        <span class="fs-4 text-logo">Say-System</span>
    </footer>
                          
</body>
